[project]
name = "applied-ml-teaching-copilot"
version = "0.1.0"
description = "An AI assistant for instructors and students working with Applied Machine Learning course materials"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.0.0",
    "logfire>=4.16.0",
    "minsearch>=0.0.5",
    "openai>=1.50.0",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "streamlit>=1.52.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
